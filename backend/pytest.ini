[pytest]
pythonpath = .
testpaths = app/tests
addopts =
    --cov=app
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=90
# Con integración MySQL: $env:RUN_INTEGRATION_DB_TESTS="1" (recomendado).
# Los unitarios de mysql_repository ya aportan la mayor parte del coverage sin Docker.
